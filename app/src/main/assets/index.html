<title>우리가족 플래너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 냉장고 문 게시판 — 위 날짜 띠, 가운데 카드 보드, 휴대폰은 아래 탭·넓은 화면은 왼쪽 레일 */
:root{
  --bg:#eef3f1; --sheet:#ffffff; --ink:#1d2b2a; --muted:#5f716e; --line:#d6e1de; --soft:#e3ece9;
  --accent:#1f6f6b; --accent-ink:#ffffff; --accent-soft:#d8ebe8;
  --sun:#e8a33d; --sun-soft:#fbefd9; --coral:#d4573f; --coral-soft:#f8e2dc; --ok:#2f8a57; --ok-soft:#dff1e6;
  --m1:#3f8fd8; --m2:#e0708f; --m3:#e8a33d; --m4:#7c64c8; --m5:#3fa27a; --m6:#c46a3a;
  --f-display:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111a19; --sheet:#1a2524; --ink:#e6efed; --muted:#9db0ac; --line:#2c3b39; --soft:#22302e;
  --accent:#5cc0b8; --accent-ink:#0f1a19; --accent-soft:#1f3a37;
  --sun:#f0b65a; --sun-soft:#3a2f1c; --coral:#f08a72; --coral-soft:#3d2620; --ok:#5cc28a; --ok-soft:#1d3527;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a19; --sheet:#1a2524; --ink:#e6efed; --muted:#9db0ac; --line:#2c3b39; --soft:#22302e;
  --accent:#5cc0b8; --accent-ink:#0f1a19; --accent-soft:#1f3a37;
  --sun:#f0b65a; --sun-soft:#3a2f1c; --coral:#f08a72; --coral-soft:#3d2620; --ok:#5cc28a; --ok-soft:#1d3527;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--accent-ink);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.top .fam{font-family:var(--f-display);font-size:20px;white-space:nowrap}
.top .date{font-size:13px;opacity:.85;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sync{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
.iconbtn{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap}
.layout{display:flex;min-height:calc(100% - 52px)}
.rail{display:none}
main{flex:1;min-width:0;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1100px;margin:0 auto;width:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sheet);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a,.rail a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;color:var(--muted);text-decoration:none;font-size:11.5px}
nav.tabs a svg,.rail a svg{width:22px;height:22px}
nav.tabs a.on,.rail a.on{color:var(--accent);font-weight:700}
@media (min-width:900px){
  nav.tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:2px;width:96px;flex:none;padding:14px 6px;border-right:1px solid var(--line);background:var(--sheet);position:sticky;top:52px;height:calc(100vh - 52px)}
  .rail a{border-radius:12px;padding:10px 4px;font-size:12.5px}
  .rail a.on{background:var(--accent-soft)}
  main{padding-bottom:40px}
}

/* blocks */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.head h2{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card h3 .sp{flex:1}
.empty{color:var(--muted);font-size:13.5px;padding:6px 0}
.btn{border:0;border-radius:11px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink);font-weight:500}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.warn{background:var(--coral);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--soft);min-width:0}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--sheet);flex:none;display:grid;place-items:center;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.pro{background:var(--sun-soft);color:var(--sun)}
.pill.red{background:var(--coral-soft);color:var(--coral)}
.pill.amber{background:var(--sun-soft);color:var(--sun)}
.pill.green{background:var(--ok-soft);color:var(--ok)}
.pill.teal{background:var(--accent-soft);color:var(--accent)}
.face{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.face.lg{width:34px;height:34px;font-size:14px}
.notice{background:var(--sun-soft);border-radius:12px;padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.notice .main{flex:1;min-width:200px}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:5px 12px;font-size:13px}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lock{text-align:center;padding:26px 16px}
.lock p{color:var(--muted);max-width:42ch;margin:8px auto 14px}
a.link{color:var(--accent)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0}
.cal .dow:first-child,.cal .d.sun .n{color:var(--coral)}
.cal .d{background:var(--sheet);border:1px solid var(--line);border-radius:10px;min-height:76px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cal .d.out{opacity:.4}
.cal .d.today{border:2px solid var(--accent)}
.cal .d.sel{background:var(--accent-soft)}
.cal .n{font-size:13px;font-weight:700}
.cal .lun{font-size:10px;color:var(--muted);font-weight:400;margin-left:3px}
.cal .ev{font-size:10.5px;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
@media (max-width:520px){.cal .d{min-height:58px}.cal .ev{font-size:9.5px}.cal .lun{display:none}}

/* bars */
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,19,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:21px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fld label{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:90px;resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.acts .sp{flex:1}
.optlist{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px}
.opt .main{flex:1;min-width:0}
.opt .s{font-size:12.5px;color:var(--muted)}
.ai-out{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* fridge cart */
.cart{width:34px;height:34px;border-radius:10px;border:0;background:var(--sun);color:#1d2b2a;display:grid;place-items:center;flex:none;padding:0}
.cart svg{width:19px;height:19px}
.stat{width:34px;flex:none;display:grid;place-items:center}
.dot{width:12px;height:12px;border-radius:50%}

/* week meals */
.meals{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:4px}
.meals .h{font-size:12px;color:var(--muted);text-align:center;padding:4px}
.meals .dl{font-size:13px;font-weight:700;display:flex;flex-direction:column;justify-content:center}
.meals .dl span{font-size:11px;color:var(--muted);font-weight:400}
.meals button{min-height:52px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:5px;font-size:12.5px;text-align:left;overflow-wrap:anywhere}
.meals button.todayrow{border-color:var(--accent)}
.meals button:empty::after{content:"+";color:var(--muted)}

/* stickers */
.stickers{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.stk{width:30px;height:30px;border-radius:50%;background:var(--sun);display:grid;place-items:center;color:#fff}
.stk svg{width:18px;height:18px}
.stk.off{background:var(--soft)}

/* wall dashboard */
.wall{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:grid;gap:14px;grid-template-columns:minmax(0,1fr);grid-template-areas:"clock" "today" "cal" "lists" "kids" "next" "ticker"}
@media (min-width:1000px){.wall{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto 1fr auto auto;
  grid-template-areas:"clock cal today" "next cal lists" "kids kids lists" "ticker ticker ticker"}}
.wall .card{padding:16px 18px}
.w-clock{grid-area:clock}.w-cal{grid-area:cal}.w-today{grid-area:today}.w-lists{grid-area:lists}.w-kids{grid-area:kids}.w-next{grid-area:next}
.w-clock .time{font-family:var(--f-display);font-size:clamp(56px,9vw,104px);line-height:1;color:var(--accent)}
.w-clock .dt{font-size:18px;margin-top:6px}
.wx{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px;text-align:center;font-size:12px}
.wx b{display:block;font-size:14px}
.ticker{grid-area:ticker;background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:12px 18px;overflow:hidden;white-space:nowrap}
.ticker span{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:0;white-space:normal}}
.wall .cal .d{min-height:64px}
.wall .close{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:51;opacity:.6}

/* grandparent view */
.grand{font-size:22px}
.grand h2{font-size:34px}
.grand .row .t{font-size:22px}
.grand .row .s{font-size:17px}
.grand .card{padding:20px}
</style>

<header class="top">
  <span class="fam" id="famName">우리가족</span>
  <span class="date" id="topDate"></span>
  <span class="sync" id="syncPill">이 기기에 저장</span>
  <button class="iconbtn" data-act="wall" title="거실 대시보드">대시보드</button>
</header>
<div class="layout">
  <div class="rail" id="rail"></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
/* ---------- 기본 도구 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>ymd(new Date());
const DOW=["일","월","화","수","목","금","토"];
const won=n=>(Math.round(n)||0).toLocaleString("ko-KR")+"원";
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h11l2-8H6.2"/><circle cx="9.5" cy="19.5" r="1.5"/><circle cx="17.5" cy="19.5" r="1.5"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  todo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 12l3 3 5-6"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>',
  fridge:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M5 10h14M9 6v2M9 13v3"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="13" rx="3"/><circle cx="12" cy="12.5" r="2.5"/></svg>',
  meal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 13h16a8 8 0 0 1-16 0zM12 9V4M8 9V6M16 9V6"/></svg>',
  kid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="7" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'
};

/* ---------- 저장소 ---------- */
const KEY="familyPlanner.v1", LKEY="familyPlanner.local";
const COLS=["members","events","todos","shop","fridge","ledger","meals","kids","growth","stickers"];
function sget(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=sget(KEY);
let L=Object.assign({me:"",pro:true,stores:[
  {name:"쿠팡",url:"https://www.coupang.com/np/search?q={q}"},
  {name:"네이버쇼핑",url:"https://search.shopping.naver.com/search/all?query={q}"},
  {name:"컬리",url:"https://www.kurly.com/search?sword={q}"},
  {name:"SSG닷컴",url:"https://www.ssg.com/search.ssg?query={q}"}],
  sync:{projectId:"",apiKey:"",code:""},aiUrl:"",city:{name:"강릉",lat:37.75,lon:128.88},famName:"우리가족"},sget(LKEY)||{});
function saveLocal(){sset(LKEY,L)}

function sample(){
  const t=new Date(), T=ymd(t), y=t.getFullYear();
  const m=[{id:"m1",name:"아빠",color:"var(--m1)"},{id:"m2",name:"엄마",color:"var(--m2)"},{id:"m3",name:"첫째",color:"var(--m3)"},{id:"m4",name:"둘째",color:"var(--m4)"}];
  const d=n=>ymd(addDays(t,n));
  const o={example:true,members:m,
   events:[
    {id:uid(),date:T,time:"18:30",title:"둘째 피아노 학원",type:"일정",repeat:"weekly",who:"m4"},
    {id:uid(),date:d(2),time:"10:00",title:"첫째 치과 검진",type:"일정",repeat:"none",who:"m2"},
    {id:uid(),date:d(5),time:"",title:"가족 캠핑",type:"일정",repeat:"none",who:"all"},
    {id:uid(),date:y+"-01-01",title:"할머니 생신 (음력 10월 3일)",type:"기념일",repeat:"lunar",lunarM:10,lunarD:3,who:"all"},
    {id:uid(),date:y+"-01-01",title:"할아버지 제사 (음력 11월 20일)",type:"기념일",repeat:"lunar",lunarM:11,lunarD:20,who:"all"},
    {id:uid(),date:(y-15)+"-05-12",title:"결혼기념일",type:"기념일",repeat:"yearly",who:"all"},
    {id:uid(),date:y+"-01-25",title:"관리비 납부",type:"납부",repeat:"monthly",who:"m1"},
    {id:uid(),date:y+"-01-15",title:"통신비 자동이체 확인",type:"납부",repeat:"monthly",who:"m2"},

let LUN;try{LUN=new Intl.DateTimeFormat("ko-KR-u-ca-chinese",{year:"numeric",month:"numeric",day:"numeric"})}catch(e){LUN=null}
const lunCache=new Map();
function lunar(ds){
  if(!LUN)return null;
  if(lunCache.has(ds))return lunCache.get(ds);
  let r=null;
  try{const p=LUN.formatToParts(parse(ds));let mo=(p.find(x=>x.type==="month")||{}).value||"";const leap=/윤|bis/.test(mo);
    r={m:parseInt(mo.replace(/\D/g,""),10),d:parseInt((p.find(x=>x.type==="day")||{}).value,10),leap}}catch(e){}
  lunCache.set(ds,r);return r;
}
function lunarMatch(ev,ds){
  const l=lunar(ds);if(!l||l.leap||l.m!==ev.lunarM)return false;
  if(l.d===ev.lunarD)return true;
  if(ev.lunarD===30&&l.d===29){const n=lunar(ymd(addDays(parse(ds),1)));return n&&n.d===1}
  return false;
}
/* ---------- 일정 반복 ---------- */
function occurs(ev,ds){
  if(ev.del)return false;
  const r=ev.repeat||"none";
  if(r==="none")return ev.date===ds;
  if(r==="lunar")return lunarMatch(ev,ds);
  if(ds<ev.date)return false;
  const a=parse(ev.date),b=parse(ds);
  if(r==="weekly")return a.getDay()===b.getDay();
  if(r==="monthly"){const last=new Date(b.getFullYear(),b.getMonth()+1,0).getDate();return Math.min(a.getDate(),last)===b.getDate()}
  if(r==="yearly")return a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  return false;
}
function eventsOn(ds){return live("events").filter(e=>occurs(e,ds)).sort((x,y)=>(x.time||"99").localeCompare(y.time||"99"))}
function upcoming(days,types){
  const out=[],t=new Date(),T=today();
  for(let i=0;i<=days;i++){const ds=ymd(addDays(t,i));
    live("events").forEach(e=>{if((!types||types.includes(e.type))&&occurs(e,ds)&&!out.some(o=>o.ev.id===e.id))out.push({ev:e,ds,dd:diffDays(ds,T)})})}
  // D-day는 범위 밖이어도 표시
  if(!types||types.includes("D-day"))live("events").filter(e=>e.type==="D-day"&&e.repeat==="none"&&e.date>=T&&!out.some(o=>o.ev.id===e.id)).forEach(e=>out.push({ev:e,ds:e.date,dd:diffDays(e.date,T)}));
  return out.sort((a,b)=>a.dd-b.dd);
}

function growthSvg(rows){
  if(rows.length<2)return '<div class="empty">기록이 2개 이상이면 성장 그래프가 그려져요.</div>';
  const W=300,H=110,P=26,xs=rows.map(r=>parse(r.date).getTime()),ys=rows.map(r=>r.height);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.floor(Math.min(...ys)-1),y1=Math.ceil(Math.max(...ys)+1);
  const X=t=>P+(t-x0)/(x1-x0||1)*(W-P*2),Y=v=>H-18-(v-y0)/(y1-y0||1)*(H-34);
  const pts=rows.map((r,i)=>X(xs[i]).toFixed(1)+","+Y(r.height).toFixed(1)).join(" ");
  const last=rows[rows.length-1];
  return '<svg viewBox="0 0 '+W+" "+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="키 변화 그래프">'+
   '<line x1="'+P+'" x2="'+(W-P)+'" y1="'+Y(y0)+'" y2="'+Y(y0)+'" stroke="var(--line)"/><line x1="'+P+'" x2="'+(W-P)+'" y1="'+Y(y1)+'" y2="'+Y(y1)+'" stroke="var(--line)" stroke-dasharray="3 3"/>'+
   '<text x="2" y="'+(Y(y1)+4)+'" font-size="10" fill="var(--muted)">'+y1+'</text><text x="2" y="'+(Y(y0)+4)+'" font-size="10" fill="var(--muted)">'+y0+"</text>"+
   '<polygon points="'+X(xs[0]).toFixed(1)+","+Y(y0)+" "+pts+" "+X(xs[xs.length-1]).toFixed(1)+","+Y(y0)+'" fill="var(--accent-soft)"/>'+
   '<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+
   rows.map((r,i)=>'<circle cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(r.height).toFixed(1)+'" r="'+(i===rows.length-1?4.5:3)+'" fill="var(--accent)"/>').join("")+
   '<text x="'+(X(xs[xs.length-1])-4)+'" y="'+(Y(last.height)-8)+'" font-size="11" text-anchor="end" fill="var(--ink)" font-weight="700">'+last.height+"cm</text>"+
   '<text x="'+P+'" y="'+(H-3)+'" font-size="10" fill="var(--muted)">'+esc(rows[0].date.slice(2).replace(/-/g,"."))+'</text><text x="'+(W-P)+'" y="'+(H-3)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+esc(last.date.slice(2).replace(/-/g,"."))+"</text></svg>";
}
function kidCard(k){

  const st=live("stickers").filter(s=>s.kid===k.id),goal=Number(k.goal)||10,cur=st.length%goal===0&&st.length?goal:st.length%goal,round=Math.floor(st.length/goal);

/* ---------- 날씨 (Open-Meteo, 키 필요 없음) ---------- */
let wxCache=null;
function wxIcon(c){return c<=1?"맑음":c<=3?"구름":c<=48?"안개":c<=67?"비":c<=77?"눈":c<=82?"소나기":c<=86?"눈":"뇌우"}
function loadWeather(){
  if(wxCache&&Date.now()-wxCache.at<18e5&&wxCache.city===L.city.name)return Promise.resolve(wxCache);
  const u="https://api.open-meteo.com/v1/forecast?latitude="+L.city.lat+"&longitude="+L.city.lon+"&daily=weathercode,temperature_2m_max,temperature_2m_min&current_weather=true&timezone=Asia%2FSeoul";
  return fetch(u).then(r=>r.ok?r.json():null).then(j=>{if(!j||!j.daily)return null;
    wxCache={at:Date.now(),city:L.city.name,now:j.current_weather?Math.round(j.current_weather.temperature):null,nowTxt:j.current_weather?wxIcon(j.current_weather.weathercode):"",
      days:j.daily.time.map((d,i)=>({date:d,icon:wxIcon(j.daily.weathercode[i]),max:Math.round(j.daily.temperature_2m_max[i]),min:Math.round(j.daily.temperature_2m_min[i])}))};return wxCache}).catch(()=>null);
}

let aiState="none",sampleFn=null;
async function initAI(){
  try{if(window.claude&&window.claude.use){const s=await window.claude.use("sample");if(s){sampleFn=s;aiState="sample"}}}catch(e){}
  if(aiState!=="sample"&&L.aiUrl)aiState="server";

async function askAI(prompt,images){
  if(aiState==="sample"&&sampleFn){
    return sampleFn.json(prompt,images?{images}:{});
  }
  if(L.aiUrl){
    let img=null;if(images&&images[0])img=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(images[0])});
    const r=await fetch(L.aiUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,image:img})});
    if(!r.ok)throw {code:"server"};const j=await r.json();return j.result!==undefined?j.result:j;
  }
  throw {code:"no_ai"};
}

/* ---------- 가족 공유 (Firestore REST) ---------- */
let syncT=null,syncing=false,lastSync=0;
function syncOn(){const s=L.sync;return !!(s.projectId&&s.apiKey&&s.code)}
function docUrl(){const s=L.sync;return "https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(s.projectId)+"/databases/(default)/documents/families/"+encodeURIComponent(s.code)+"?key="+encodeURIComponent(s.apiKey)}
function merge(remote){
  let changed=false;
  COLS.forEach(c=>{const rl=remote[c]||[];rl.forEach(r=>{const i=S[c].findIndex(x=>x.id===r.id);if(i<0){S[c].push(r);changed=true}else if((r.upd||0)>(S[c][i].upd||0)){S[c][i]=r;changed=true}})});
  if(remote.example===false&&S.example){S.example=false;changed=true}
  return changed;
}
function setPill(t){const p=$("#syncPill");if(p)p.textContent=t}
async function doSync(){
  if(!syncOn()||syncing)return;syncing=true;setPill("맞추는 중");
  try{
    const g=await fetch(docUrl());let changed=false;
    if(g.ok){const j=await g.json();const raw=j.fields&&j.fields.data&&j.fields.data.stringValue;if(raw){changed=merge(JSON.parse(raw))}}
    else if(g.status!==404)throw new Error("HTTP "+g.status);
    if(dirty||changed||g.status===404){
      const body={fields:{data:{stringValue:JSON.stringify(Object.assign({example:!!S.example},Object.fromEntries(COLS.map(c=>[c,S[c]]))))},updated:{integerValue:String(Date.now())}}};
      const p=await fetch(docUrl(),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      if(!p.ok)throw new Error("HTTP "+p.status);dirty=false;
    }
    sset(KEY,S);lastSync=Date.now();setPill("가족과 공유 중");
    if(changed&&!$("#layer").innerHTML)render();
    const m=$("#syncMsg");if(m)m.textContent="마지막으로 맞춘 시각 "+new Date().toLocaleTimeString("ko-KR");
  }catch(e){setPill("공유 연결 안 됨");const m=$("#syncMsg");if(m)m.textContent="연결하지 못했어요: "+(e.message||"인터넷 또는 Firebase 설정을 확인하세요")+". Firestore 데이터베이스를 만들고 규칙에서 families 문서 읽기·쓰기를 허용했는지 확인하세요."}
  syncing=false;
}
function queueSync(){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(doSync,1500)}
setInterval(()=>{if(syncOn()&&document.visibilityState!=="hidden")doSync()},15000);

  addStore:()=>form("쇼핑몰 추가",[{k:"name",label:"이름",ph:"예: 이마트몰"},{k:"url",label:"검색 주소",ph:"https://...{q}",help:"검색 결과 주소에서 검색어 자리를 {q}로 바꿔 넣으세요."}],v=>{if(!v.name||!v.url.includes("{q}"))return toast("이름과 {q}가 들어간 주소를 넣어 주세요");L.stores.push(v);saveLocal();closeSheet();render()}),

  backup:()=>{const txt=JSON.stringify(Object.assign({app:"우리가족 플래너",at:new Date().toISOString()},Object.fromEntries(COLS.map(c=>[c,live(c)]))));
    if(window.AndroidBridge&&window.AndroidBridge.share){window.AndroidBridge.share(txt);return}
    sheet('<h3>백업</h3><p style="margin:-4px 0 10px;font-size:13.5px;color:var(--muted)">아래 글자를 모두 복사해 카톡 나에게 보내기나 메모에 보관하세요.</p><div class="fld"><textarea id="bkTxt" readonly style="min-height:160px">'+esc(txt)+'</textarea></div><div class="acts"><span class="sp"></span><button class="btn ghost" data-act="close">닫기</button><button class="btn" data-act="copyBk">복사</button></div>')},
  copyBk:()=>{const t=$("#bkTxt");navigator.clipboard&&navigator.clipboard.writeText(t.value).then(()=>toast("복사했어요"),()=>{t.select();toast("글자를 길게 눌러 복사하세요")})||(t.select())},
  restore:()=>{sheet('<h3>되살리기</h3><div class="fld"><label for="rsTxt">백업 글자 붙여넣기</label><textarea id="rsTxt" style="min-height:160px"></textarea></div><div class="acts"><span class="sp"></span><button class="btn ghost" data-act="close">취소</button><button class="btn" data-act="doRestore">되살리기</button></div>')},
  doRestore:()=>{try{const o=JSON.parse($("#rsTxt").value);if(!o.members)throw 0;const now=Date.now();COLS.forEach(c=>{(o[c]||[]).forEach(x=>x.upd=now)});merge(o);S.example=false;save();closeSheet();render();toast("되살렸어요")}catch(e){toast("백업 글자가 올바르지 않아요")}},
  resetAll:d=>{const b=document.querySelector('[data-act="resetAll"]');if(!b.dataset.sure){b.dataset.sure="1";b.textContent="정말요? 한 번 더 누르세요";return}
    const now=Date.now();COLS.forEach(c=>{if(c!=="members")S[c].forEach(x=>{x.del=true;x.upd=now})});S.example=false;save();render();toast("모두 지웠어요")}
};
function kidForm(k){const isNew=!k;k=k||{goal:10,reward:""};form(isNew?"아이 추가":"아이 고치기",[{k:"name",label:"이름",value:k.name},{k:"goal",label:"스티커 목표 개수",type:"number",value:k.goal},{k:"reward",label:"다 모으면 받을 보상",value:k.reward,ph:"예: 주말 영화 보기"}],
  v=>{if(!v.name)return toast("이름을 적어 주세요");put("kids",Object.assign(k,v,{goal:Number(v.goal)||10}));closeSheet();render()},isNew?null:()=>{del("kids",k.id);closeSheet();render()})}
const MCOL=["var(--m1)","var(--m2)","var(--m3)","var(--m4)","var(--m5)","var(--m6)"];
function memberForm(m){const isNew=!m;m=m||{color:MCOL[live("members").length%6]};form(isNew?"구성원 추가":"구성원 고치기",[{k:"name",label:"이름 (호칭)",value:m.name,ph:"예: 엄마, 지우"},{k:"color",label:"색",type:"select",options:MCOL.map((c,i)=>[c,["파랑","분홍","노랑","보라","초록","주황"][i]]),value:m.color}],
  v=>{if(!v.name)return toast("이름을 적어 주세요");put("members",Object.assign(m,v));if(!L.me){L.me=m.id;saveLocal()}closeSheet();render()},isNew||live("members").length<2?null:()=>{del("members",m.id);closeSheet();render()})}

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;const fn=A[el.dataset.act];if(!fn)return;
  if(el.tagName==="A"&&el.getAttribute("href"))return;
  ev.preventDefault();fn(el.dataset,el,ev);
});
document.addEventListener("submit",ev=>{
  ev.preventDefault();
  if(ev.target.id==="theForm"&&formCtx)formCtx.onSave(readForm());
  if(ev.target.id==="shopAdd"){const i=$("#shopName"),v=i.value.trim();if(!v)return;const m=v.match(/^(.*?)\s+(\d+\S*)$/);put("shop",{name:m?m[1]:v,qty:m?m[2]:"",done:false});render();const n=$("#shopName");if(n)n.focus()}
});
document.addEventListener("change",ev=>{
  if(ev.target.id==="proChk"){L.pro=ev.target.checked;saveLocal();render()}
  if(ev.target.id==="meSel"){L.me=ev.target.value;saveLocal();render()}
  if(ev.target.id==="famIn"){L.famName=ev.target.value.trim()||"우리가족";saveLocal();render()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&$("#layer").innerHTML)closeSheet()});

saveLocal();sset(KEY,S);
render();
initAI().then(()=>{if(cur()==="setup")render()});
if(syncOn())doSync();
})();
</script>
