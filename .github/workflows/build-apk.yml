name: APK 만들기
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: 고정 서명 키 준비 (GitHub Secrets)
        env:
          KS: ${{ secrets.FAMILY_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/family.keystore"
            echo "FAMILY_KEYSTORE_PATH=$RUNNER_TEMP/family.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::FAMILY_KEYSTORE 비밀값이 없어 임시 키로 서명합니다. 이 APK는 다음 버전으로 업데이트되지 않습니다."
          fi
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        env:
          FAMILY_KEY_PASS: ${{ secrets.FAMILY_KEY_PASS }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk family-planner.apk
      - uses: actions/upload-artifact@v4
        with: { name: family-planner-apk, path: family-planner.apk }
      - name: 다운로드 페이지에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 우리가족 플래너 v1.0.${{ github.run_number }}
          body: 아래 family-planner.apk 를 눌러 내려받은 뒤 휴대폰에서 설치하세요.
          files: family-planner.apk
          make_latest: true
