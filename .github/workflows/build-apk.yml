name: APK 만들기
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk family-planner.apk
      - uses: actions/upload-artifact@v4
        with: { name: family-planner-apk, path: family-planner.apk }
      - name: 다운로드 페이지에 APK 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 우리가족 플래너 v1.0.${{ github.run_number }}
          body: 아래 family-planner.apk 를 눌러 내려받은 뒤 휴대폰에서 설치하세요.
          files: family-planner.apk
          make_latest: true
